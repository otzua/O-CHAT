name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Triggers for tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APKs (with architecture splits)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        run: |
          echo "APK files built:"
          find app/build/outputs/apk/release -name "*.apk" -type f -exec ls -lh {} \;

      - name: Rename APKs for GitHub Release
        run: |
          cd app/build/outputs/apk/release
          [ -f "app-arm64-v8a-release-unsigned.apk" ] && mv app-arm64-v8a-release-unsigned.apk ochat-arm64.apk
          [ -f "app-x86_64-release-unsigned.apk" ] && mv app-x86_64-release-unsigned.apk ochat-x86_64.apk
          [ -f "app-universal-release-unsigned.apk" ] && mv app-universal-release-unsigned.apk ochat-universal.apk

      - name: DEBUG
        run: |
          set -x
          pwd
          ls -all
          cd app/build/outputs/
          ls -all
          tree || ls -R

      # Optional: Sign APKs (uncomment and configure secrets when ready)
      # - name: Sign APKs
      #   uses: r0adkll/sign-android-release@v1
      #   with:
      #     releaseDirectory: app/build/outputs/apk/release
      #     signingKeyBase64: ${{ secrets.SIGNING_KEY }}
      #     alias: ${{ secrets.ALIAS }}
      #     keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
      #     keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ochat-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    # Creating a release writes to repository contents. The repository default for
    # GITHUB_TOKEN is read-only, so without this the publish step fails with
    # "403 Resource not accessible by integration" after a successful build.
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ochat-release-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ochat-arm64.apk
            release/ochat-x86_64.apk
            release/ochat-universal.apk
          name: OChat ${{ github.ref_name }}
          body: |
            ## Downloads

            | File | For |
            |---|---|
            | **ochat-arm64.apk** | ARM64 — essentially every modern phone. Pick this one. |
            | **ochat-x86_64.apk** | x86_64 — Chromebooks, some tablets, emulators |
            | **ochat-universal.apk** | All architectures — larger, use if unsure |

            Requires Android 8.0 (API 26) or newer.

            ### Notes

            - These APKs are **unsigned**. Android will warn on install; allow installation
              from unknown sources to proceed.
            - OChat installs **alongside** bitchat rather than replacing it. The two use
              different application IDs, so you can run both and message between them.
            - Protocol compatibility with bitchat is unchanged — OChat talks to unmodified
              bitchat clients on Android and iOS.

            OChat is a fork of [bitchat-android](https://github.com/permissionlesstech/bitchat-android),
            licensed under GPL-3.0.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
