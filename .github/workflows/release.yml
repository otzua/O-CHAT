name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*' # Triggers for tags like v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    # Declared at job level, not on the signing step. A step's own env block is not
    # available to that step's `if` expression, so `if: env.SIGNING_KEY != ''` would
    # always have seen an empty value and skipped signing - shipping unsigned APKs
    # that Android refuses to install.
    env:
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: wrapper

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Release APKs (with architecture splits)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APK files
        run: |
          echo "APK files built:"
          find app/build/outputs/apk/release -name "*.apk" -type f -exec ls -lh {} \;

      - name: Rename APKs for GitHub Release
        run: |
          cd app/build/outputs/apk/release
          [ -f "app-arm64-v8a-release-unsigned.apk" ] && mv app-arm64-v8a-release-unsigned.apk ochat-arm64.apk
          [ -f "app-x86_64-release-unsigned.apk" ] && mv app-x86_64-release-unsigned.apk ochat-x86_64.apk
          [ -f "app-universal-release-unsigned.apk" ] && mv app-universal-release-unsigned.apk ochat-universal.apk

      - name: DEBUG
        run: |
          set -x
          pwd
          ls -all
          cd app/build/outputs/
          ls -all
          tree || ls -R

      # Signs every release APK in place. Requires four repository secrets:
      # SIGNING_KEY (base64 of the keystore), ALIAS, KEY_STORE_PASSWORD, KEY_PASSWORD.
      # If SIGNING_KEY is absent the step is skipped and the build produces UNSIGNED
      # APKs, which Android refuses to install - so treat a skipped run as a failed release.
      - name: Sign APKs
        if: ${{ env.SIGNING_KEY != '' }}
        run: |
          set -euo pipefail
          echo "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/release.jks"
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          cd app/build/outputs/apk/release
          for apk in ochat-*.apk; do
            "$BT/zipalign" -p -f 4 "$apk" "aligned-$apk"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.jks" \
              --ks-key-alias "${{ secrets.ALIAS }}" \
              --ks-pass "pass:${{ secrets.KEY_STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$apk" "aligned-$apk"
            rm -f "aligned-$apk"
            "$BT/apksigner" verify "$apk"
            echo "signed and verified: $apk"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ochat-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    # Creating a release writes to repository contents. The repository default for
    # GITHUB_TOKEN is read-only, so without this the publish step fails with
    # "403 Resource not accessible by integration" after a successful build.
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ochat-release-${{ github.ref_name }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ochat-arm64.apk
            release/ochat-x86_64.apk
            release/ochat-universal.apk
          name: OChat ${{ github.ref_name }}
          body: |
            ## Downloads

            | File | For |
            |---|---|
            | **ochat-arm64.apk** | ARM64 — essentially every modern phone. Pick this one. |
            | **ochat-x86_64.apk** | x86_64 — Chromebooks, some tablets, emulators |
            | **ochat-universal.apk** | All architectures — larger, use if unsure |

            Requires Android 8.0 (API 26) or newer.

            ### Notes

            - These APKs are **unsigned**. Android will warn on install; allow installation
              from unknown sources to proceed.
            - OChat installs **alongside** bitchat rather than replacing it. The two use
              different application IDs, so you can run both and message between them.
            - Protocol compatibility with bitchat is unchanged — OChat talks to unmodified
              bitchat clients on Android and iOS.

            OChat is a fork of [bitchat-android](https://github.com/permissionlesstech/bitchat-android),
            licensed under GPL-3.0.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
